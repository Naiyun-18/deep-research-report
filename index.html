<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Research | 深度研究报告库</title>
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1a2634; --sub:#5b6b7b;
    --teal:#2b5f8f; --teal-strong:#1d4a73; --teal-soft:#e6eef6;
    --amber:#b45309; --line:#e2e9f2;
    --shadow:0 4px 18px rgba(31,55,90,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:24px 16px}
  .wrap{max-width:1020px;margin:0 auto}
  .hero{background:linear-gradient(135deg,#2b5f8f,#1d4a73);color:#fff;border-radius:16px;padding:30px 32px;margin-bottom:22px;box-shadow:var(--shadow)}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  .hero .sub{margin-top:8px;font-size:13.5px;opacity:.92}
  .hero .tagline{margin-top:14px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;font-size:12px}
  .card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .num{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--teal);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .rep{background:#f7fafd;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;transition:.2s}
  .rep:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--teal)}
  .rep .ctg{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;align-self:flex-start}
  .ctg-mid{background:var(--teal-soft);color:var(--teal)}
  .ctg-new{background:#fff4e5;color:#b26a00;margin-left:6px}
  .rep h3{font-size:16px;font-weight:700;margin:10px 0 4px}
  .rep .co{font-size:12.5px;color:var(--sub)}
  .rep .dt{font-size:12px;color:var(--sub);margin-top:6px}
  .rep .desc{font-size:12.5px;color:var(--sub);margin-top:8px;min-height:38px}
  .rep a.link{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600;font-size:13.5px;text-decoration:none}
  .rep a.link:hover{color:var(--teal-strong);text-decoration:underline}
  .note{font-size:12.5px;color:var(--sub);margin-top:10px}
  .note b{color:var(--ink)}
  .footer{margin-top:8px;font-size:12px;color:#8a97a8;text-align:center;padding:14px 0 4px}
  @media(max-width:520px){.hero h1{font-size:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>📚 Deep Research | 深度研究报告库</h1>
    <div class="sub">深度研究专题报告 · 多源交叉验证 · 数据来源与推断边界全标注</div>
    <div class="tagline">点击下方报告卡片,即可在线查看完整研究报告(各版本均归档保留)</div>
  </div>

  <div class="card">
    <h2><span class="num">1</span>最新深度研究报告</h2>
    <div class="grid" id="reportGrid"><!-- 动态渲染 --></div>
    <div class="note">📌 <b>版本说明：</b>卡片仅链接各报告的最新版本；历史版本（v1/v2/…）均在 Git 仓库中归档保留，可经仓库文件列表或提交历史回溯。报告内均含“数据与资料来源”专章及推断边界说明。</div>
  </div>

  <div class="footer">Deep Research · GitHub Pages 报告库 | 新报告将在此持续更新</div>

</div>

<script>
// ===== 报告清单(新增报告时在此追加一条即可,无需改动页面结构) =====
const REPORTS = [
  {
    company: "存储产业链位元产值脱钩现象分析",
    code: "—",
    type: "行业深度研究报告",
    date: "2026-11-06",
    url: "存储产业链位元产值脱钩现象分析_v1.pdf",
    isNew: true,
    desc: "位元(容量)权重与产值(金额)权重脱钩的结构性趋势：企业级eSSD大容量TLC/QLC合约锁定vs消费级UFS/PC/车规/AI PC缓存抬升ASP，2027位元供给转正但产值端仍紧；叠加美国国会变局(11/3民主党重夺参众两院)对存储产业链的四条传导路径，映射到A股存储链三端口(产值端/位元端/资本开支端)投资框架与避坑要点。",
  },
  {
    company: "闪迪消费级业务下滑",
    code: "SNDK",
    type: "个股深度研究报告",
    date: "2026-11-06",
    url: "闪迪消费级业务下滑_v1.pdf",
    isNew: true,
    desc: "核实闪迪消费级营收序列9.07→8.2→5.56→3.97亿美元(较峰值-56%、同比-39%)；全球存储厂商(三星/海力士/美光/铠侠/西数)消费级营收口径对比与出货量代理指标；存储市场由企业级/AI主导的结构性转向研判，消费级量价齐跌下2027H2供给侧驱动的回暖机会点。",
  },
  {
    company: "鼎龙股份",
    code: "300054",
    type: "个股深度研究报告",
    date: "2026-11-02",
    url: "鼎龙股份深度研究_v1.pdf",
    isNew: false,
    desc: "以鼎龙股份为主体的全景重构版：公司转型全景（半导体占比67%）、六大业务线市场空间、竞争格局与份额口径辨析、CMP垫/液/光刻胶三曲线深度分析、财务估值、10年营收推演（2035基准120亿、三情景96-148亿）。",
  },
];

// 渲染
const grid = document.getElementById('reportGrid');
grid.innerHTML = REPORTS.map(r =>
  `<div class="rep">
     <div><span class="ctg ctg-mid">${r.type}</span>${r.isNew ? '<span class="ctg ctg-new">最新</span>' : ''}</div>
     <h3>${r.company}</h3>
     <div class="co">${r.code} · ${r.date}</div>
     <div class="desc">${r.desc}</div>
     ${r.links
       ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">${r.links.map(l => `<a class="link" style="margin-top:0" href="${l.url}" target="_blank">${l.name} →</a>`).join('')}</div>`
       : `<a class="link" href="${r.url}" target="_blank">查看报告 →</a>`}
   </div>`
).join('');
</script>
</body>
</html>
